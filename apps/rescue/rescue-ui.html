<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玉兔 · 独立救援</title>
<style>
:root{font:18px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#e6eeeb;background:#191e20;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:20px 24px}header{display:flex;gap:16px;align-items:center;border-bottom:1px solid #394340}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}button,input,textarea{font:inherit}button{background:#286c55;color:white;border:1px solid #52786b;border-radius:6px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent}.status{margin-left:auto;color:#c0d5cc}section{padding:20px 0;border-bottom:1px solid #394340}[hidden]{display:none!important}label{display:grid;gap:8px}input,textarea{min-width:0;width:100%;border:1px solid #62716b;border-radius:6px;background:#222a2c;color:#eef3ef;padding:10px}textarea{min-height:110px;resize:vertical}.toolbar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}small{color:#b4c3bc}ol{padding-left:24px}li{margin:8px 0;overflow-wrap:anywhere;white-space:pre-wrap}.error{color:#ffc0b7}#events{max-height:42vh;overflow:auto}#inputs{max-height:20vh;overflow:auto}.meta{font-size:14px;color:#b4c3bc}.stop{background:#763b44}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #93ceae;outline-offset:3px}@media(max-width:560px){header,main{padding:16px}header{flex-wrap:wrap}.status{margin-left:0;width:100%}}
</style>
<header><h1>玉兔 · 独立救援</h1><span class="status" id="phase">需要登录</span></header>
<main><section id="login"><form id="login-form"><label>救援访问令牌<input id="token" type="password" autocomplete="off" required></label><div class="toolbar"><button>连接救援服务</button></div></form></section>
<div id="workspace" hidden><section><h2>修复进展</h2><small id="budget"></small><ol id="events" aria-live="polite"></ol></section><section><h2>补充要求</h2><ol id="inputs"></ol><form id="input-form"><label for="text">发给维修助手</label><textarea id="text" required></textarea><div class="toolbar"><button>发送补充</button><button type="button" id="run" class="secondary">让独立模型处理</button><button type="button" id="stop" class="stop">停止推理</button></div></form></section></div><p id="error" class="error" role="alert"></p></main>
<script>
const $=id=>document.getElementById(id);let timer;
async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
function rows(id,items){const box=$(id);box.replaceChildren(...items.map(item=>{const li=document.createElement('li');li.textContent=item;return li}))}
async function refresh(){clearTimeout(timer);try{const s=await api('state');$('login').hidden=true;$('workspace').hidden=false;$('phase').textContent=({'idle':'等待维修','staged':'候选已暂存','checking':'正在核验','checked':'核验通过，待激活','applying':'正在替换程序','restarting':'正在重启核验','completed':'修复完成','rolled-back':'已回滚','recovery-required':'需要核查中断操作'})[s.phase]||s.phase;$('budget').textContent=`独立API请求 ${s.api.calls}/${s.api.maxCalls} · 已暂存 ${s.stagedFiles.length} 个程序文件`;rows('events',s.events.map(e=>e.time.slice(11,19)+' '+e.message));rows('inputs',s.inputs.map(e=>e.text));$('run').disabled=s.api.running;$('error').textContent='';timer=setTimeout(refresh,document.hidden?30000:s.api.running||s.busy?1000:10000)}catch(e){$('error').textContent=e.message;timer=setTimeout(refresh,30000)}}
$('login-form').onsubmit=async e=>{e.preventDefault();try{await api('session',{token:$('token').value});$('token').value='';await refresh()}catch(e){$('error').textContent=e.message}};
$('input-form').onsubmit=async e=>{e.preventDefault();try{await api('input',{text:$('text').value});$('text').value='';await refresh()}catch(e){$('error').textContent=e.message}};
$('run').onclick=async()=>{try{await api('run',{});await refresh()}catch(e){$('error').textContent=e.message}};
$('stop').onclick=async()=>{try{await api('stop',{});await refresh()}catch(e){$('error').textContent=e.message}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});refresh();
</script></html>
